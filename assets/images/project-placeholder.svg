<svg width="400" height="250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#a855f7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="#0a0e1e"/>
  <rect width="400" height="250" fill="url(#bgGradient)"/>
  
  <!-- Center decorative circle -->
  <circle cx="200" cy="125" r="60" fill="none" stroke="url(#iconGradient)" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="125" r="45" fill="none" stroke="url(#iconGradient)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Mobile phone icon -->
  <g transform="translate(165, 75)">
    <!-- Phone body -->
    <rect x="0" y="0" width="70" height="100" rx="8" fill="none" stroke="url(#iconGradient)" stroke-width="2"/>
    <!-- Phone screen -->
    <rect x="6" y="8" width="58" height="80" rx="4" fill="none" stroke="url(#iconGradient)" stroke-width="1.5"/>
    <!-- Home button -->
    <circle cx="35" cy="92" r="2.5" fill="url(#iconGradient)"/>
  </g>
  
  <!-- App/project text -->
  <text x="200" y="200" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#e6eef8">
    Mobile App
  </text>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#94a3b8">
    Project Showcase
  </text>
</svg>